<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentOps V6 - Agentic Coding Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* === Reset & Base === */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  height: 100%; overflow: hidden;
  font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg-primary); color: var(--text-primary);
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  font-size: 13px;
}
:root {
  --bg-primary: #272930; --bg-secondary: #2d2f37; --bg-card: #34363f;
  --bg-elevated: #3c3e48; --bg-tertiary: #3c3e48; --bg-hover: #474952;
  --border: #52545e; --border-hover: #6a6c74;
  --text-primary: #ece9e4; --text-secondary: #a09d96; --text-muted: #6e6b64;
  --accent: #C76A3A; --accent-light: #E08A5A; --accent-bg: rgba(199, 106, 58, 0.13);
  --success: #2DA06C; --success-bg: rgba(45, 160, 108, 0.12);
  --warning: #D4A017; --warning-bg: rgba(212, 160, 23, 0.12);
  --danger: #D94848; --danger-bg: rgba(217, 72, 72, 0.12);
  --bg-filter: #2a2c35; --bg-input: #34363f; --bg-chip: #2f313a; --border-chip: #52545e;
  --text-inverse: #ffffff; --text-bright: #f0ede8; --text-card-desc: #93908a;
  --text-placeholder: #6e6b64; --text-queue: #8a8780; --text-meta: #7a7770;
  --text-time: #8a8780; --text-dim: #5e5b54; --text-link: #C76A3A;
  --scrollbar-thumb: rgba(255,255,255,0.14); --selection: rgba(199, 106, 58, 0.30);
  --shadow-card: 0 2px 8px rgba(0,0,0,0.18), 0 0 1px rgba(0,0,0,0.12);
  --shadow-dropdown: 0 12px 40px rgba(0,0,0,0.40), 0 0 1px rgba(0,0,0,0.12);
  --shadow-modal: 0 24px 80px rgba(0,0,0,0.45), 0 0 1px rgba(0,0,0,0.12);
  --overlay-bg: rgba(0,0,0,0.55);
  --logo-gradient: linear-gradient(135deg, #C76A3A, #D4A060);
  --progress-gradient: linear-gradient(90deg, #C76A3A, #E08A5A);
  --accent-glow: rgba(199,106,58,0.25); --accent-glow-strong: rgba(199,106,58,0.55);
  --bg-log: #22242c; --bg-diff: #22242c; --border-diff: #3c3e48;
  --text-label: #a09d96; --text-subtle: #7a7770; --text-muted2: #8a8780;
  --text-faint: #5e5b54; --text-light: #d5d2cc; --text-soft: #b5b2ab;
  --text-bright2: #dddad5; --text-mid: #bdbab4;
  --bg-step-idle: #474952; --bg-step-running: rgba(199,106,58,0.08);
  --bg-intervention: rgba(199,106,58,0.08);
  --bg-user-bubble: rgba(199,106,58,0.15); --border-user-bubble: rgba(199,106,58,0.30);
  --bg-badge: #D94848;
  --bg-ai-avatar: linear-gradient(135deg,#2DA06C,#248F5C);
  --bg-user-avatar: linear-gradient(135deg,#C76A3A,#E08A5A);
  --bg-inline-badge: rgba(199,106,58,0.15);
  --progress-bg: rgba(255,255,255,0.08);
  --diff-add-bg: rgba(45,160,108,0.08); --diff-del-bg: rgba(217,72,72,0.08);
  --bg-pause-event: rgba(255,255,255,0.03);
}
[data-theme="light"] {
  --bg-primary: #F5F3F0; --bg-secondary: #FFFFFF; --bg-card: #FFFFFF;
  --bg-elevated: #EDEAE6; --bg-tertiary: #EDEAE6; --bg-hover: #E5E2DD;
  --border: #D8D4CE; --border-hover: #B8B4AC;
  --text-primary: #1C1D23; --text-secondary: #5C5952; --text-muted: #8A8780;
  --accent-bg: rgba(199, 106, 58, 0.07); --success-bg: rgba(45, 160, 108, 0.08);
  --warning-bg: rgba(212, 160, 23, 0.08); --danger-bg: rgba(217, 72, 72, 0.08);
  --bg-filter: #EDEAE6; --bg-input: #EDEAE6; --bg-chip: #E5E2DD; --border-chip: #D0CCC6;
  --text-inverse: #ffffff; --text-bright: #1C1D23; --text-card-desc: #5C5952;
  --text-placeholder: #8A8780; --text-queue: #8A8780; --text-meta: #8A8780;
  --text-time: #8A8780; --text-dim: #A8A5A0; --text-link: #B05A2A;
  --scrollbar-thumb: rgba(0,0,0,0.10); --selection: rgba(199, 106, 58, 0.16);
  --shadow-card: 0 8px 24px rgba(0,0,0,0.06); --shadow-dropdown: 0 12px 40px rgba(0,0,0,0.10);
  --shadow-modal: 0 24px 80px rgba(0,0,0,0.10); --overlay-bg: rgba(0,0,0,0.30);
  --accent-glow: rgba(199,106,58,0.12); --accent-glow-strong: rgba(199,106,58,0.35);
  --bg-log: #f0eeeb; --bg-diff: #f5f3f0; --border-diff: #d8d4ce;
  --text-label: #5C5952; --text-subtle: #8A8780; --text-muted2: #8A8780;
  --text-faint: #A8A5A0; --text-light: #3a3835; --text-soft: #5c5952;
  --text-bright2: #2a2925; --text-mid: #4a4740;
  --bg-step-idle: #e0ddd8; --bg-step-running: rgba(199,106,58,0.06);
  --bg-intervention: rgba(199,106,58,0.06); --bg-user-bubble: rgba(199,106,58,0.08);
  --border-user-bubble: rgba(199,106,58,0.18); --bg-badge: #D94848;
  --bg-ai-avatar: linear-gradient(135deg,#2DA06C,#248F5C);
  --bg-user-avatar: linear-gradient(135deg,#C76A3A,#E08858);
  --bg-inline-badge: rgba(199,106,58,0.08); --progress-bg: rgba(0,0,0,0.05);
  --diff-add-bg: rgba(45,160,108,0.08); --diff-del-bg: rgba(217,72,72,0.08);
  --bg-pause-event: rgba(0,0,0,0.02);
}
::selection { background: var(--selection); }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }
::-webkit-scrollbar-track { background: transparent; }
.app { display: flex; flex-direction: column; height: 100vh; }

/* === Top Bar === */
.top-bar {
  height: 56px; flex-shrink: 0;
  background: var(--bg-secondary); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 24px; gap: 12px;
  position: relative; z-index: 100;
}
.logo-area { display: flex; align-items: center; gap: 10px; margin-right: 8px; flex-shrink: 0; cursor: pointer; }
.logo-icon { width: 30px; height: 30px; border-radius: 8px; background: var(--logo-gradient); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; letter-spacing: 0.5px; }
.logo-text { font-size: 15px; font-weight: 700; color: var(--text-primary); letter-spacing: 0.3px; }
.nav-links { display: flex; align-items: center; gap: 2px; margin-right: 20px; flex-shrink: 0; }
.nav-link { padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 500; color: var(--text-secondary); cursor: pointer; transition: all 0.2s; border: 1px solid transparent; position: relative; user-select: none; }
.nav-link:hover { color: var(--text-primary); background: var(--bg-hover); }
.nav-link.active { color: var(--accent-light); background: var(--accent-bg); border-color: rgba(199,106,58,0.20); font-weight: 600; }
.search-area { flex: 1; display: flex; justify-content: center; max-width: 520px; margin: 0 auto; }
.search-box { width: 100%; position: relative; }
.search-box input { width: 100%; padding: 8px 16px 8px 38px; border-radius: 10px; background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text-primary); font-size: 13px; outline: none; transition: all 0.2s; font-family: inherit; }
.search-box input::placeholder { color: var(--text-muted); }
.search-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(199,106,58,0.12); }
.search-box .s-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-placeholder); pointer-events: none; }
.search-box .s-shortcut { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; font-size: 11px; color: var(--text-placeholder); pointer-events: none; }
.top-bar-right { display: flex; align-items: center; gap: 12px; margin-left: auto; flex-shrink: 0; }
.icon-btn { width: 36px; height: 36px; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; position: relative; font-size: 15px; }
.icon-btn:hover { background: var(--bg-hover); color: var(--text-primary); border-color: var(--border); }
.notif-badge { position: absolute; top: 4px; right: 4px; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); border: 2px solid var(--bg-secondary); }
.avatar-btn { width: 32px; height: 32px; border-radius: 8px; border: 2px solid var(--border); background: var(--logo-gradient); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: var(--text-inverse); transition: all 0.15s; }
.avatar-btn:hover { border-color: var(--accent); }
.avatar-dropdown { position: absolute; top: calc(100% + 8px); right: 0; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 10px; padding: 6px; min-width: 200px; box-shadow: var(--shadow-dropdown); display: none; z-index: 200; }
.avatar-dropdown.show { display: block; }
.avatar-dropdown-header { padding: 12px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
.avatar-dropdown-header .name { font-weight: 600; font-size: 14px; }
.avatar-dropdown-header .email { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
.nav-dropdown-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 6px; cursor: pointer; color: var(--text-secondary); font-size: 13px; transition: all 0.15s; white-space: nowrap; }
.nav-dropdown-item:hover { background: var(--bg-hover); color: var(--text-primary); }

/* === Page Container === */
.page-container { flex: 1; overflow-y: auto; overflow-x: hidden; }
.page-section { display: none; min-height: 100%; }
.page-section.active { display: flex; flex-direction: column; }
.page-header { padding: 20px 32px 0; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.page-header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
.page-header-desc { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
.filter-bar { padding: 16px 32px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.filter-chip { padding: 5px 14px; border-radius: 6px; font-size: 12px; font-weight: 500; background: var(--bg-card); border: 1px solid var(--border); color: var(--text-secondary); cursor: pointer; transition: all 0.15s; user-select: none; }
.filter-chip:hover { border-color: var(--border-hover); color: var(--text-primary); }
.filter-chip.active { background: var(--accent-bg); border-color: var(--accent); color: var(--accent-light); }
.filter-chip-pill { padding: 5px 14px; border-radius: 14px; font-size: 12px; font-weight: 500; background: var(--bg-chip); border: 1px solid var(--border-chip); color: var(--text-secondary); cursor: pointer; transition: all 0.2s; white-space: nowrap; user-select: none; }
.filter-chip-pill:hover { color: var(--text-primary); border-color: var(--border-hover); background: var(--bg-hover); }
.filter-chip-pill.active { background: var(--accent-bg); border-color: var(--accent); color: var(--accent-light); font-weight: 600; }
.view-toggle { display: flex; background: var(--bg-chip); border: 1px solid var(--border-chip); border-radius: 8px; overflow: hidden; margin-left: 8px; }
.view-btn { width: 32px; height: 30px; border: none; background: transparent; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
.view-btn:hover { color: var(--text-secondary); }
.view-btn.active { background: rgba(199,106,58,0.15); color: var(--accent-light); }
.filter-search { position: relative; }
.filter-search input { padding: 6px 12px 6px 32px; border-radius: 6px; background: var(--bg-card); border: 1px solid var(--border); color: var(--text-primary); font-size: 12px; font-family: inherit; outline: none; width: 220px; transition: all 0.2s; }
.filter-search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(199,106,58,0.12); }
.filter-search input::placeholder { color: var(--text-placeholder); }
.filter-search .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-placeholder); pointer-events: none; }

/* === Buttons === */
.btn { padding: 7px 16px; border-radius: 6px; font-size: 13px; font-weight: 500; border: 1px solid transparent; cursor: pointer; transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px; font-family: inherit; }
.btn-primary { background: var(--accent); color: var(--text-inverse); border-color: var(--accent); }
.btn-primary:hover { background: var(--accent); filter: brightness(0.88); }
.btn-secondary { background: var(--bg-card); color: var(--text-primary); border-color: var(--border); }
.btn-secondary:hover { border-color: var(--border-hover); background: var(--bg-hover); }
.btn-ghost { background: transparent; color: var(--text-secondary); }
.btn-ghost:hover { background: var(--bg-hover); color: var(--text-primary); }
.btn-danger { background: var(--danger-bg); color: var(--danger); border-color: rgba(255,107,107,0.2); }
.btn-danger:hover { background: rgba(255,107,107,0.2); }
.btn-success { background: var(--success-bg); color: var(--success); border-color: rgba(0,210,160,0.2); }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-xs { padding: 2px 8px; font-size: 11px; border-radius: 4px; }

/* === Tags === */
.tag { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; gap: 4px; }
.tag-purple { background: var(--accent-bg); color: var(--accent-light); }
.tag-green { background: var(--success-bg); color: var(--success); }
.tag-yellow { background: var(--warning-bg); color: var(--warning); }
.tag-red { background: var(--danger-bg); color: var(--danger); }
.tag-gray { background: var(--bg-elevated); color: var(--text-secondary); }

/* === Slide Panel === */
.slide-panel-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 300; opacity: 0; visibility: hidden; transition: all 0.3s; }
.slide-panel-overlay.show { opacity: 1; visibility: visible; }
.slide-panel { position: fixed; top: 0; right: 0; bottom: 0; width: 45vw; min-width: 500px; max-width: 800px; background: var(--bg-secondary); border-left: 1px solid var(--border); z-index: 301; transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); display: flex; flex-direction: column; }
.slide-panel.show { transform: translateX(0); }
.slide-panel-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.slide-panel-header .back-btn { width: 32px; height: 32px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
.slide-panel-header .back-btn:hover { border-color: var(--border-hover); color: var(--text-primary); }
.slide-panel-header .sp-title { font-size: 16px; font-weight: 600; flex: 1; }
.slide-panel-body { flex: 1; overflow-y: auto; padding: 0; }
.slide-panel-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; gap: 8px; flex-shrink: 0; background: var(--bg-secondary); }

/* === Tabs === */
.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); padding: 0 24px; flex-shrink: 0; }
.tab { padding: 10px 16px; font-size: 13px; color: var(--text-secondary); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; font-weight: 500; user-select: none; }
.tab:hover { color: var(--text-primary); }
.tab.active { color: var(--accent-light); border-bottom-color: var(--accent); }

/* === Modal === */
.modal-overlay { position: fixed; inset: 0; background: var(--overlay-bg); z-index: 400; display: none; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
.modal-overlay.show { display: flex; }
.modal { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; min-width: 480px; max-width: 680px; width: 90%; max-height: 85vh; display: flex; flex-direction: column; box-shadow: var(--shadow-modal); animation: modalIn 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
@keyframes modalIn { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
.modal-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.modal-header h2 { font-size: 16px; font-weight: 600; }
.modal-close { width: 28px; height: 28px; border-radius: 6px; border: none; background: transparent; color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; }
.modal-close:hover { background: var(--bg-hover); color: var(--text-primary); }
.modal-body { flex: 1; overflow-y: auto; padding: 24px; }
.modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }

/* === Form === */
.form-group { margin-bottom: 20px; }
.form-label { display: block; font-size: 12px; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; }
.form-input, .form-select, .form-textarea { width: 100%; padding: 8px 12px; border-radius: 8px; background: var(--bg-card); border: 1px solid var(--border); color: var(--text-primary); font-size: 13px; font-family: inherit; outline: none; transition: all 0.2s; }
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(199,106,58,0.12); }
.form-textarea { min-height: 80px; resize: vertical; }
.form-hint { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

/* === Kanban === */
.kanban { padding: 16px 32px; display: flex; gap: 16px; overflow-x: auto; height: calc(100vh - 56px - 60px); }
.kanban-col { min-width: 280px; max-width: 320px; flex: 1; display: flex; flex-direction: column; }
.kanban-col-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; padding: 0 4px; }
.kanban-col-dot { width: 8px; height: 8px; border-radius: 50%; }
.kanban-col-title { font-size: 13px; font-weight: 600; }
.kanban-col-count { font-size: 11px; color: var(--text-muted); background: var(--bg-elevated); padding: 1px 8px; border-radius: 10px; }
.kanban-cards { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-bottom: 8px; }
.kanban-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; cursor: pointer; transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1); position: relative; }
.kanban-card:hover { border-color: var(--border-hover); transform: translateY(-2px); box-shadow: var(--shadow-card); }
.kanban-card .card-title { font-size: 13px; font-weight: 600; color: var(--text-bright); margin-bottom: 4px; line-height: 1.4; }
.kanban-card .card-desc { font-size: 12px; color: var(--text-card-desc); margin-bottom: 12px; line-height: 1.5; }
.kanban-card .card-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 10px; }
.kanban-card .card-progress { margin-top: 12px; display: flex; align-items: center; gap: 8px; }
.kanban-card .card-progress-bar { flex: 1; height: 3px; background: var(--progress-bg); border-radius: 2px; overflow: hidden; }
.kanban-card .card-progress-fill { height: 100%; border-radius: 2px; background: var(--accent); transition: width 0.5s; }
.kanban-card .card-progress-text { font-size: 10px; color: var(--accent-light); font-weight: 600; white-space: nowrap; }
.status-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-right: 4px; box-shadow: 0 0 6px var(--accent-glow-strong); animation: statusPulse 2s ease-in-out infinite; }
@keyframes statusPulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

/* List View */
.list-view { flex: 1; overflow-y: auto; }
.list-row { display: flex; align-items: center; gap: 12px; padding: 12px 24px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.15s; }
.list-row:hover { background: var(--bg-hover); }
.list-row .list-status { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.list-row .list-title { font-size: 13px; font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-row .list-type { font-size: 11px; color: var(--text-secondary); width: 80px; }
.list-row .list-provider { font-size: 11px; color: var(--text-muted); width: 100px; }
.list-row .list-time { font-size: 11px; color: var(--text-muted); width: 80px; text-align: right; }

/* === Template Grid === */
.template-grid { padding: 0 32px 32px; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.template-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; cursor: pointer; transition: all 0.2s; }
.template-card:hover { border-color: var(--border-hover); transform: translateY(-2px); box-shadow: var(--shadow-card); }
.template-card .t-icon { font-size: 28px; margin-bottom: 12px; }
.template-card .t-name { font-size: 15px; font-weight: 600; margin-bottom: 6px; }

/* === Wizard Steps === */

.recommend-card { padding: 12px 16px; border-radius: 10px; border: 2px solid var(--accent); background: var(--accent-bg); cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 12px; }

.settings-content { flex: 1; overflow-y: auto; padding: 24px 32px; }

.credential-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); }

.provider-setting-card .ps-info { flex: 1; min-width: 0; }
.provider-setting-card .ps-name { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }

.pvd-test-btn.test-fail { background: var(--danger-bg); color: var(--danger); border-color: rgba(255,107,107,0.3); }

/* === Req Cards === */
.req-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 16px; padding: 20px 32px 32px; }
.req-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; cursor: pointer; transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1); position: relative; display: flex; flex-direction: column; gap: 12px; }
.req-card:hover { border-color: var(--border-hover); transform: translateY(-2px); box-shadow: var(--shadow-card); }
.req-card-top { display: flex; align-items: center; justify-content: space-between; }
.req-priority-tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 4px; font-size: 11px; font-weight: 600; }
.req-priority-tag.p1 { background: var(--danger-bg); color: var(--danger); }

.req-card-title { font-size: 14px; font-weight: 600; color: var(--text-bright); line-height: 1.4; }
.req-stage-progress { display: flex; align-items: center; gap: 0; padding: 4px 0; }
.req-stage-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; border: 2px solid var(--border); background: transparent; transition: all 0.2s; }
.req-stage-dot.completed { background: var(--success); border-color: var(--success); }
.req-stage-dot.current { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); animation: stagePulse 2s ease-in-out infinite; }
.req-stage-dot.pending { border-color: var(--text-dim); background: transparent; }
.req-stage-line { width: 24px; height: 2px; flex-shrink: 0; background: var(--border); transition: background 0.2s; }
.req-stage-line.completed { background: var(--success); }
.req-stage-line.current { background: linear-gradient(90deg, var(--success), var(--accent)); }
.req-card-meta { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--text-secondary); flex-wrap: wrap; }
.req-card-meta .meta-item { display: flex; align-items: center; gap: 4px; }
.req-card-artifacts { display: flex; gap: 6px; flex-wrap: wrap; }
.req-artifact-badge { display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; background: var(--success-bg); color: var(--success); }
.req-card-footer { display: flex; align-items: center; justify-content: space-between; padding-top: 12px; border-top: 1px solid var(--border); margin-top: auto; }
.req-card-source { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }

.req-detail-section:last-child { border-bottom: none; }
.req-section-label { font-size: 11px; font-weight: 600; color: var(--text-label); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.req-info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.req-info-item .info-label { font-size: 10px; color: var(--text-subtle); text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 3px; }
.req-info-item .info-value { font-size: 13px; color: var(--text-primary); }

/* Stage timeline */
.stage-timeline { display: flex; align-items: flex-start; justify-content: center; padding: 16px 0 8px; }
.stage-node { display: flex; flex-direction: column; align-items: center; gap: 8px; flex: 1; min-width: 0; z-index: 1; }
.stage-node .stage-dot { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; transition: all 0.3s; flex-shrink: 0; }
.stage-node.completed .stage-dot { background: var(--success); color: #fff; box-shadow: 0 2px 8px rgba(45,160,108,0.25); }
.stage-node.current .stage-dot { background: var(--accent); color: #fff; box-shadow: 0 2px 8px rgba(199,106,58,0.35); animation: stagePulse 2s ease-in-out infinite; }
.stage-node.pending .stage-dot { background: transparent; border: 2px dashed var(--border-hover); color: var(--text-muted); }
.stage-node .stage-label { font-size: 11px; font-weight: 500; text-align: center; }
.stage-node.completed .stage-label { color: var(--success); }
.stage-node.current .stage-label { color: var(--accent); font-weight: 600; }
.stage-node.pending .stage-label { color: var(--text-muted); }
.stage-connector { flex: 1; height: 2px; min-width: 16px; margin-top: 14px; z-index: 0; flex-shrink: 0; }
.stage-connector.completed { background: var(--success); }
.stage-connector.pending { background: transparent; border-top: 2px dashed var(--border); }

/* Subtask items */
.subtask-detail-item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; transition: all 0.15s; }
.subtask-detail-item:last-child { margin-bottom: 0; }
.subtask-detail-item.own-pending:hover { border-color: var(--accent); background: var(--bg-elevated); cursor: pointer; }
.subtask-detail-icon { font-size: 18px; width: 24px; text-align: center; flex-shrink: 0; }

.subtask-detail-title { font-size: 13px; font-weight: 600; color: var(--text-primary); }
.subtask-detail-meta { font-size: 11px; color: var(--text-muted); margin-top: 4px; display: flex; align-items: center; gap: 8px; }
.subtask-launch-btn { padding: 5px 14px; border-radius: 6px; font-size: 12px; font-weight: 600; background: var(--accent); color: var(--text-inverse); border: none; cursor: pointer; transition: all 0.15s; font-family: inherit; }

.subtask-progress { width: 80px; height: 4px; background: var(--progress-bg); border-radius: 2px; overflow: hidden; }

/* Linked req card */
.linked-req-card { display: flex; align-items: center; gap: 10px; padding: 12px 14px; margin: 16px 24px 0; background: var(--bg-card); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 8px; cursor: pointer; transition: all 0.15s; }

/* Collapsible */
.collapsible { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.collapsible-header { padding: 12px 16px; background: var(--bg-elevated); cursor: pointer; display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 500; }

/* JSON Block */
.json-block { background: var(--bg-primary); border: 1px solid var(--border); border-radius: 8px; padding: 16px; font-family: "JetBrains Mono", monospace; font-size: 12px; line-height: 1.6; color: var(--text-secondary); overflow-x: auto; white-space: pre; }

/* === Command Palette === */
.cmd-overlay { position: fixed; inset: 0; background: var(--overlay-bg); z-index: 500; display: none; align-items: flex-start; justify-content: center; padding-top: 20vh; backdrop-filter: blur(4px); }

.cmd-section-title { padding: 8px 12px; font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
.cmd-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; cursor: pointer; transition: all 0.1s; }
.cmd-item:hover { background: var(--accent-bg); }
.cmd-item .cmd-item-icon { width: 28px; height: 28px; border-radius: 6px; background: var(--bg-elevated); display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
.cmd-item .cmd-item-text { flex: 1; }

/* === Toast === */
.toast-container { position: fixed; top: 68px; right: 24px; z-index: 600; display: flex; flex-direction: column; gap: 8px; }
.toast { padding: 12px 16px; border-radius: 8px; min-width: 280px; max-width: 400px; display: flex; align-items: center; gap: 10px; font-size: 13px; border: 1px solid var(--border); background: var(--bg-elevated); box-shadow: var(--shadow-card); animation: toastIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
.toast.removing { animation: toastOut 0.3s ease forwards; }
@keyframes toastIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
@keyframes toastOut { to { opacity: 0; transform: translateX(40px); } }

.toast.success .toast-icon { color: var(--success); }
.toast.warning { border-color: rgba(254,202,87,0.3); }
.toast.warning .toast-icon { color: var(--warning); }
.toast.error { border-color: rgba(255,107,107,0.3); }
.toast.error .toast-icon { color: var(--danger); }

/* === Confirm Dialog === */
.confirm-overlay { position: fixed; inset: 0; background: var(--overlay-bg); z-index: 500; display: none; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
.confirm-overlay.show { display: flex; }
.confirm-dialog { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; width: 400px; padding: 24px; text-align: center; box-shadow: var(--shadow-modal); animation: modalIn 0.2s ease; }

/* Req filter bar */
.req-filter-bar { padding: 12px 32px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; border-bottom: 1px solid var(--border); background: var(--bg-filter); }

  running: { label: '运行中', color: '#C76A3A', dot: true },
  pending: { label: '排队中', color: '#8a8780', dot: false },
  scheduled: { label: '已调度', color: '#8a8780', dot: false },
  succeeded: { label: '已完成', color: '#2DA06C', dot: false },
  failed: { label: '失败', color: '#D94848', dot: false },
  cancelled: { label: '已取消', color: '#6e6b64', dot: false },
  paused: { label: '已暂停', color: '#D4A017', dot: true },
};
var stIconMap = { frontend: '🖥️', backend: '⚙️', testing: '🧪', docs: '📄', other: '📋' };

function cssVar(n) { return 'var(' + n + ')'; }
function escapeHtml(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// =============================================
// ROUTING
// =============================================
var routeMap = { '#/': 'page-requirements', '#/tasks': 'page-tasks', '#/templates': 'page-templates', '#/settings': 'page-settings' };
var reqFilterStage = 'all'; var reqViewMode = 'card'; var taskFilterStatus = 'all'; var taskViewMode = 'kanban'; var tplFilterCat = 'all'; var settingsTab = 'credentials';

function navigate(hash) { window.location.hash = hash; }

function handleRoute() {
  var hash = window.location.hash || '#/';
  closeAllMenus();
  document.querySelectorAll('.page-section').forEach(function(p) { p.classList.remove('active'); });
  var pageId = routeMap[hash];
  if (pageId) { var el = document.getElementById(pageId); if (el) el.classList.add('active'); }
  document.querySelectorAll('.nav-link[data-route]').forEach(function(l) { l.classList.toggle('active', l.dataset.route === hash); });
  // Render page content
  if (pageId === 'page-requirements') renderRequirementsPage();
  else if (pageId === 'page-tasks') renderKanban();
  else if (pageId === 'page-templates') renderTemplates();
  else if (pageId === 'page-settings') renderSettings();
}
window.addEventListener('hashchange', handleRoute);
window.addEventListener('load', handleRoute);

// =============================================
// MENU / DROPDOWN / THEME
// =============================================
function toggleMenu(id) { var m = document.getElementById(id); var o = m.classList.contains('show'); closeAllMenus(); if (!o) m.classList.add('show'); }
function closeAllMenus() { document.querySelectorAll('.avatar-dropdown,.dropdown-menu,.nav-dropdown').forEach(function(m) { m.classList.remove('show'); }); }
document.addEventListener('click', function(e) { if (!e.target.closest('.avatar-dropdown') && !e.target.closest('.avatar-btn')) closeAllMenus(); });
function toggleTheme() { var t = document.documentElement.getAttribute('data-theme') === 'light' ? '' : 'light'; document.documentElement.setAttribute('data-theme', t); showToast(t === 'light' ? '已切换到亮色模式' : '已切换到暗色模式', 'success'); }

// =============================================
// TOAST / CONFIRM
// =============================================
function showToast(msg, type) {
  type = type || 'success';
  var icons = { success: '&#10004;', warning: '&#9888;', error: '&#10008;' };
  var c = document.getElementById('toast-container');
  var t = document.createElement('div');
  t.className = 'toast ' + type;
  t.innerHTML = '<span class="toast-icon">' + icons[type] + '</span><span>' + msg + '</span><span class="toast-close" onclick="this.parentElement.classList.add(\'removing\');setTimeout(()=>this.parentElement.remove(),300)">&#10005;</span>';
  c.appendChild(t);
  setTimeout(function() { if (t.parentElement) { t.classList.add('removing'); setTimeout(function() { if (t.parentElement) t.remove(); }, 300); } }, 3000);
}

var _confirmCallback = null;
function confirmAction(title, desc, callback) {
  document.getElementById('confirm-title').textContent = title;
  document.getElementById('confirm-desc').textContent = desc;
  document.getElementById('confirm-overlay').classList.add('show');
  _confirmCallback = callback;
  document.getElementById('confirm-ok').onclick = function() { closeConfirm(); if (_confirmCallback) _confirmCallback(); };
}
function closeConfirm() { document.getElementById('confirm-overlay').classList.remove('show'); _confirmCallback = null; }

// =============================================
// COMMAND PALETTE
// =============================================
function openCommandPalette() { document.getElementById('cmd-overlay').classList.add('show'); setTimeout(function() { document.getElementById('cmd-input').focus(); }, 100); renderCommandPalette(''); }
function closeCommandPalette() { document.getElementById('cmd-overlay').classList.remove('show'); document.getElementById('cmd-input').value = ''; }
function filterCommandPalette(q) { renderCommandPalette(q); }

function renderCommandPalette(q) {
  q = (q||'').toLowerCase(); var html = '';
  html += '<div class="cmd-section-title">快速操作</div>';
  var actions = [
    { icon: '&#128203;', title: '需求列表', sub: '查看需求列表首页', action: "navigate('#/')" },
    { icon: '&#10010;', title: '新建任务', sub: '创建新的 Agent 任务', action: 'openCreateTask()' },
    { icon: '&#128196;', title: '浏览模板', sub: '查看预置模板', action: "navigate('#/templates')" },
    { icon: '&#9881;', title: '设置', sub: '凭证、API Key、仓库配置', action: "navigate('#/settings')" },
  ];
  actions.forEach(function(a) { if (!q || a.title.toLowerCase().includes(q) || a.sub.toLowerCase().includes(q)) html += '<div class="cmd-item" onclick="closeCommandPalette();' + a.action + '"><div class="cmd-item-icon">' + a.icon + '</div><div class="cmd-item-text"><div class="cmd-title">' + a.title + '</div><div class="cmd-sub">' + a.sub + '</div></div></div>'; });
  var ft = mockTasks.filter(function(t) { return !q || t.title.toLowerCase().includes(q); });
  if (ft.length) { html += '<div class="cmd-section-title">最近任务</div>'; ft.slice(0, 5).forEach(function(t) { html += '<div class="cmd-item" onclick="closeCommandPalette();openTaskDetail(\'' + t.id + '\')"><div class="cmd-item-icon">' + (t.status === 'running' ? '&#9654;' : '&#9632;') + '</div><div class="cmd-item-text"><div class="cmd-title">' + t.title + '</div><div class="cmd-sub">' + t.id + ' · ' + t.status + '</div></div></div>'; }); }
  if (!html) html = '<div style="padding:20px;text-align:center;color:var(--text-muted)">无匹配结果</div>';
  document.getElementById('cmd-results').innerHTML = html;
}

// =============================================
// KEYBOARD SHORTCUTS
// =============================================
document.addEventListener('keydown', function(e) {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); var o = document.getElementById('cmd-overlay'); if (o.classList.contains('show')) closeCommandPalette(); else openCommandPalette(); return; }
  if (e.key === 'Escape') { closeCommandPalette(); closeSlidePanel(); closeConfirm(); if (document.getElementById('create-task-modal').classList.contains('show')) closeCreateTask(); return; }
  if (e.key === 'n' && !e.ctrlKey && !e.metaKey && !e.altKey && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') openCreateTask();
});

// =============================================
// SLIDE PANEL
// =============================================
function openSlidePanel(title, bodyHtml) {
  document.getElementById('slide-title').textContent = title;
  document.getElementById('slide-body').innerHTML = bodyHtml;
  document.getElementById('slide-overlay').classList.add('show');
  document.getElementById('slide-panel').classList.add('show');
  var footer = document.getElementById('slide-footer'); footer.innerHTML = ''; footer.style.display = 'none';
}
function closeSlidePanel() {
  document.getElementById('slide-overlay').classList.remove('show');
  document.getElementById('slide-panel').classList.remove('show');
  document.getElementById('slide-footer').innerHTML = '';
  document.getElementById('slide-footer').style.display = 'none';
  currentDetailTask = null;
}

// =============================================
// REQUIREMENTS PAGE
// =============================================
function setReqFilter(stage, el) {
  reqFilterStage = stage;
  document.querySelectorAll('.req-filter-bar .filter-chip-pill').forEach(function(c) { c.classList.remove('active'); });
  el.classList.add('active');
  renderRequirementsPage();
}
function setReqView(mode) {
  reqViewMode = mode;
  document.getElementById('req-view-card').classList.toggle('active', mode === 'card');
  document.getElementById('req-view-list').classList.toggle('active', mode === 'list');
  renderRequirementsPage();
}

function renderRequirementsPage() {
  var q = (document.getElementById('req-search-input') || {}).value || '';
  q = q.toLowerCase();
  var items = mockWorkItems.filter(function(w) {
    if (reqFilterStage !== 'all') { var s = w.stages.find(function(s) { return s.status === 'current'; }); if (!s || s.key !== reqFilterStage) return false; }
    if (q && !w.title.toLowerCase().includes(q) && !w.description.toLowerCase().includes(q)) return false;
    return true;
  });
  if (reqViewMode === 'card') renderRequirementsCards(items);
  else renderRequirementsList(items);
}

function renderRequirementsCards(items) {
  document.getElementById('req-grid').style.display = '';
  document.getElementById('req-list-view').style.display = 'none';
  if (!items.length) { document.getElementById('req-grid').innerHTML = '<div class="empty-state"><div class="empty-icon">&#128203;</div><div class="empty-title">暂无需求</div><div class="empty-desc">调整筛选条件查看更多</div></div>'; return; }
  var h = '';
  items.forEach(function(w) {
    var pc = { P1: 'p1', P2: 'p2', P3: 'p3' };
    h += '<div class="req-card" onclick="openRequirementDetail(\'' + w.id + '\')">';
    h += '<div class="req-card-top"><span class="req-priority-tag ' + (pc[w.priority]||'p3') + '">' + w.priority + '</span><span style="font-size:11px;color:var(--text-muted)">' + w.externalId + '</span></div>';
    h += '<div class="req-card-title">' + escapeHtml(w.title) + '</div>';
    // Stage progress
    h += '<div class="req-stage-progress">';
    w.stages.forEach(function(s, i) {
      h += '<div class="req-stage-dot ' + s.status + '"></div>';
      if (i < w.stages.length - 1) { var ns = w.stages[i+1]; h += '<div class="req-stage-line ' + (s.status === 'completed' ? (ns.status !== 'pending' ? 'completed' : 'completed') : (s.status === 'current' ? 'current' : '')) + '"></div>'; }
    });
    h += '</div>';
    // Artifacts
    if (w.artifacts.length) { h += '<div class="req-card-artifacts">'; w.artifacts.forEach(function(a) { h += '<span class="req-artifact-badge">&#10003; ' + a.title + '</span>'; }); h += '</div>'; }
    // Subtask summary
    if (w.subtasks.length) { h += '<div style="display:flex;flex-wrap:wrap;gap:6px">'; w.subtasks.forEach(function(st) { var si = stIconMap[st.type] || '📋'; var sc = st.status === 'running' ? 'var(--accent)' : st.status === 'completed' ? 'var(--success)' : 'var(--text-muted)'; h += '<span style="font-size:11px;color:' + sc + ';display:flex;align-items:center;gap:3px">' + si + ' ' + escapeHtml(st.title) + '</span>'; }); h += '</div>'; }
    // Footer
    h += '<div class="req-card-footer"><span class="req-card-source">' + w.assigneeName + ' · ' + w.syncedAt + '</span>';
    // Launch button
    var ownRunning = w.subtasks.find(function(st) { return st.status === 'running' && st.assigneeName === currentUser; });
    var ownPending = w.subtasks.find(function(st) { return st.status === 'pending' && st.assigneeName === currentUser; });
    if (ownRunning) { h += '<button class="req-launch-btn req-launch-running" onclick="event.stopPropagation();openTaskDetail(\'' + ownRunning.agentTaskId + '\')">&#9654; 查看进度</button>'; }
    else if (ownPending) { h += '<button class="req-launch-btn" onclick="event.stopPropagation();openCreateTaskForSubTask(\'' + w.id + '\',\'' + ownPending.id + '\')">&#9654; 启动任务</button>'; }
    h += '</div></div>';
  });
  document.getElementById('req-grid').innerHTML = h;
}

function renderRequirementsList(items) {
  document.getElementById('req-grid').style.display = 'none';
  document.getElementById('req-list-view').style.display = '';
  var h = '<table style="width:100%;border-collapse:collapse"><thead><tr><th style="text-align:left;padding:10px 14px;font-size:11px;font-weight:600;color:var(--text-secondary);background:var(--bg-elevated);border-bottom:1px solid var(--border)">优先级</th><th style="text-align:left;padding:10px 14px;font-size:11px;font-weight:600;color:var(--text-secondary);background:var(--bg-elevated);border-bottom:1px solid var(--border)">标题</th><th style="text-align:left;padding:10px 14px;font-size:11px;font-weight:600;color:var(--text-secondary);background:var(--bg-elevated);border-bottom:1px solid var(--border)">阶段</th><th style="text-align:left;padding:10px 14px;font-size:11px;font-weight:600;color:var(--text-secondary);background:var(--bg-elevated);border-bottom:1px solid var(--border)">负责人</th><th style="text-align:right;padding:10px 14px;font-size:11px;font-weight:600;color:var(--text-secondary);background:var(--bg-elevated);border-bottom:1px solid var(--border)">操作</th></tr></thead><tbody>';
  items.forEach(function(w) {
    var cur = w.stages.find(function(s) { return s.status === 'current'; });
    h += '<tr style="cursor:pointer" onclick="openRequirementDetail(\'' + w.id + '\')">';
    h += '<td style="padding:12px 14px;border-bottom:1px solid var(--border)"><span class="req-priority-tag ' + ({P1:'p1',P2:'p2',P3:'p3'}[w.priority]||'p3') + '">' + w.priority + '</span></td>';
    h += '<td style="padding:12px 14px;border-bottom:1px solid var(--border);font-weight:500;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + escapeHtml(w.title) + '</td>';
    h += '<td style="padding:12px 14px;border-bottom:1px solid var(--border)"><span class="tag tag-purple">' + (cur ? cur.label : '-') + '</span></td>';
    h += '<td style="padding:12px 14px;border-bottom:1px solid var(--border);font-size:12px;color:var(--text-secondary)">' + w.assigneeName + '</td>';
    h += '<td style="padding:12px 14px;border-bottom:1px solid var(--border);text-align:right">';
    var ownRunning = w.subtasks.find(function(st) { return st.status === 'running' && st.assigneeName === currentUser; });
    var ownPending = w.subtasks.find(function(st) { return st.status === 'pending' && st.assigneeName === currentUser; });
    if (ownRunning) h += '<button class="req-launch-btn req-launch-running" style="font-size:11px;padding:3px 10px" onclick="event.stopPropagation();openTaskDetail(\'' + ownRunning.agentTaskId + '\')">&#9654; 查看</button>';
    else if (ownPending) h += '<button class="req-launch-btn" style="font-size:11px;padding:3px 10px" onclick="event.stopPropagation();openCreateTaskForSubTask(\'' + w.id + '\',\'' + ownPending.id + '\')">&#9654; 启动</button>';
    h += '</td></tr>';
  });
  h += '</tbody></table>';
  document.getElementById('req-list-view').innerHTML = h;
}

// Requirement detail panel
function openRequirementDetail(wiId) {
  var w = mockWorkItems.find(function(x) { return x.id === wiId; });
  if (!w) return;
  var h = '';
  // Info
  h += '<div class="req-detail-section"><div class="req-section-label">基本信息</div>';
  h += '<div class="req-info-grid">';
  h += '<div class="req-info-item"><div class="info-label">ID</div><div class="info-value">' + w.externalId + '</div></div>';
  h += '<div class="req-info-item"><div class="info-label">优先级</div><div class="info-value">' + w.priority + '</div></div>';
  h += '<div class="req-info-item"><div class="info-label">负责人</div><div class="info-value">' + w.assigneeName + '</div></div>';
  h += '<div class="req-info-item"><div class="info-label">同步时间</div><div class="info-value">' + w.syncedAt + '</div></div>';
  h += '<div class="req-info-item" style="grid-column:1/-1"><div class="info-label">链接</div><div class="info-value"><a href="' + w.externalUrl + '" target="_blank">' + w.externalUrl + '</a></div></div>';
  h += '</div></div>';
  // Description
  h += '<div class="req-detail-section"><div class="req-section-label">描述</div><div class="req-desc-text">' + escapeHtml(w.description) + '</div></div>';
  // Stage timeline
  h += '<div class="req-detail-section"><div class="req-section-label">阶段进度</div>';
  h += '<div class="stage-timeline">';
  w.stages.forEach(function(s, i) {
    h += '<div class="stage-node ' + s.status + '"><div class="stage-dot">' + (s.status === 'completed' ? '&#10003;' : s.status === 'current' ? (i+1) : (i+1)) + '</div><div class="stage-label">' + s.label + '</div></div>';
    if (i < w.stages.length - 1) h += '<div class="stage-connector ' + (s.status === 'completed' ? 'completed' : 'pending') + '"></div>';
  });
  h += '</div></div>';
  // Artifacts
  if (w.artifacts.length) {
    h += '<div class="req-detail-section"><div class="req-section-label">已产出文档</div>';
    w.artifacts.forEach(function(a) { h += '<div style="display:flex;align-items:center;gap:8px;padding:8px 0"><span style="color:var(--success)">&#10003;</span><span style="font-size:13px">' + a.title + '</span></div>'; });
    h += '</div>';
  }
  // Subtasks
  if (w.subtasks.length) {
    h += '<div class="req-detail-section"><div class="req-section-label">子任务 <span style="font-size:10px;background:var(--bg-elevated);color:var(--text-muted);padding:1px 7px;border-radius:10px">' + w.subtasks.length + '</span></div>';
    w.subtasks.forEach(function(st) {
      var isOwn = st.assigneeName === currentUser;
      var cls = isOwn ? (st.status === 'pending' ? 'own-pending' : (st.status === 'running' ? 'own-running' : '')) : '';
      h += '<div class="subtask-detail-item ' + cls + '"';
      if (isOwn && st.status === 'pending') h += ' onclick="closeSlidePanel();openCreateTaskForSubTask(\'' + w.id + '\',\'' + st.id + '\')"';
      h += '>';
      h += '<div class="subtask-detail-icon">' + (stIconMap[st.type] || '📋') + '</div>';
      h += '<div class="subtask-detail-info"><div class="subtask-detail-title">' + escapeHtml(st.title) + '</div>';
      h += '<div class="subtask-detail-meta"><span>' + st.assigneeName + '</span></div></div>';
      h += '<div>';
      if (st.status === 'running' && st.agentTaskId) h += '<button class="subtask-launch-btn" style="background:var(--success)" onclick="event.stopPropagation();openTaskDetail(\'' + st.agentTaskId + '\')">&#9654; 查看</button>';
      else if (st.status === 'pending' && isOwn) h += '<button class="subtask-launch-btn" onclick="event.stopPropagation();closeSlidePanel();openCreateTaskForSubTask(\'' + w.id + '\',\'' + st.id + '\')">&#9654; 启动</button>';
      else if (st.status === 'completed') h += '<span style="color:var(--success);font-size:12px;font-weight:500">&#10003; 完成</span>';
      else h += '<span style="color:var(--text-muted);font-size:11px">' + st.status + '</span>';
      h += '</div></div>';
    });
    h += '</div>';
  }

  openSlidePanel(w.title, h);
  // Footer with launch button
  var ownPending = w.subtasks.find(function(st) { return st.status === 'pending' && st.assigneeName === currentUser; });
  if (ownPending) {
    document.getElementById('slide-footer').innerHTML = '<button class="btn btn-primary" style="margin-left:auto" onclick="closeSlidePanel();openCreateTaskForSubTask(\'' + w.id + '\',\'' + ownPending.id + '\')">&#9654; 启动子任务</button>';
    document.getElementById('slide-footer').style.display = 'flex';
  }
}

// =============================================
// TASKS PAGE (Kanban + List)
// =============================================
function setTaskFilter(status, el) {
  taskFilterStatus = status;
  document.querySelectorAll('#page-tasks .filter-chip-pill').forEach(function(c) { c.classList.remove('active'); });
  el.classList.add('active');
  renderKanban();
}
function setTaskView(mode) {
  taskViewMode = mode;
  document.getElementById('task-view-kanban').classList.toggle('active', mode === 'kanban');
  document.getElementById('task-view-list').classList.toggle('active', mode === 'list');
  document.getElementById('kanban-board').style.display = mode === 'kanban' ? '' : 'none';
  document.getElementById('list-view').style.display = mode === 'list' ? '' : 'none';
  if (mode === 'kanban') renderKanban(); else renderTaskList();
}

function renderKanban() {
  var filtered = taskFilterStatus === 'all' ? mockTasks : mockTasks.filter(function(t) { return t.status === taskFilterStatus; });
  var cols = [
    { key: 'pending', label: '排队中', color: '#8a8780', tasks: filtered.filter(function(t) { return t.status === 'pending' || t.status === 'scheduled'; }) },
    { key: 'running', label: '运行中', color: '#C76A3A', tasks: filtered.filter(function(t) { return t.status === 'running'; }) },
    { key: 'succeeded', label: '已完成', color: '#2DA06C', tasks: filtered.filter(function(t) { return t.status === 'succeeded'; }) },
    { key: 'failed', label: '失败/取消', color: '#D94848', tasks: filtered.filter(function(t) { return t.status === 'failed' || t.status === 'cancelled'; }) },
  ];
  var h = '';
  cols.forEach(function(col) {
    h += '<div class="kanban-col"><div class="kanban-col-header"><div class="kanban-col-dot" style="background:' + col.color + '"></div><span class="kanban-col-title">' + col.label + '</span><span class="kanban-col-count">' + col.tasks.length + '</span></div>';
    h += '<div class="kanban-cards">';
    col.tasks.forEach(function(t) {
      var meta = statusMeta[t.status] || {};
      h += '<div class="kanban-card" onclick="openTaskDetail(\'' + t.id + '\')">';
      h += '<div class="card-title">' + (meta.dot ? '<span class="status-dot"></span> ' : '') + escapeHtml(t.title) + '</div>';
      h += '<div class="card-desc">' + escapeHtml(t.desc) + '</div>';
      if (t.progress > 0 && t.status === 'running') {
        h += '<div class="card-progress"><div class="card-progress-bar"><div class="card-progress-fill" style="width:' + t.progress + '%"></div></div><span class="card-progress-text">' + t.progress + '%</span></div>';
      }
      h += '<div class="card-meta"><span class="tag" style="background:' + meta.color + '20;color:' + meta.color + '">' + meta.label + '</span><span class="tag tag-gray">' + t.provider + '</span>';
      if (t.duration) h += '<span style="font-size:10px;color:var(--text-muted)">⏱ ' + t.duration + '</span>';
      h += '</div></div>';
    });
    h += '</div></div>';
  });
  document.getElementById('kanban-board').innerHTML = h;
}

function renderTaskList() {
  var filtered = taskFilterStatus === 'all' ? mockTasks : mockTasks.filter(function(t) { return t.status === taskFilterStatus; });
  var h = '';
  filtered.forEach(function(t) {
    var meta = statusMeta[t.status] || {};
    h += '<div class="list-row" onclick="openTaskDetail(\'' + t.id + '\')">';
    h += '<div class="list-status" style="background:' + meta.color + '"></div>';
    h += '<div class="list-title">' + (meta.dot ? '<span class="status-dot"></span> ' : '') + escapeHtml(t.title) + '</div>';
    h += '<div class="list-type">' + (t.type || '-') + '</div>';
    h += '<div class="list-provider">' + t.provider + '</div>';
    h += '<div class="list-time">' + t.time + '</div>';
    h += '</div>';
  });
  document.getElementById('list-view').innerHTML = h || '<div class="empty-state"><div class="empty-icon">&#128203;</div><div class="empty-title">暂无任务</div></div>';
}

// =============================================
// TASK DETAIL
// =============================================
function openTaskDetail(taskId) {
  var task = mockTasks.find(function(t) { return t.id === taskId; });
  if (!task) return;
  currentDetailTask = task;
  navigate('#/tasks');
  renderDetailPanel();
  document.getElementById('slide-overlay').classList.add('show');
  document.getElementById('slide-panel').classList.add('show');
}

function renderDetailPanel() {
  var task = currentDetailTask; if (!task) return;
  var meta = statusMeta[task.status] || {};

function doTaskAction(action) {
  var task = currentDetailTask; if (!task) return;
  var labels = { pause: '暂停', cancel: '取消', resume: '恢复', retry: '重试' };
  showToast('已执行: ' + labels[action], 'success');
  if (action === 'pause' && task.status === 'running') task.status = 'paused';
  else if (action === 'resume' && task.status === 'paused') task.status = 'running';
  else if (action === 'cancel') task.status = 'cancelled';
  else if (action === 'retry') { task.status = 'running'; task.progress = 0; task.currentStep = 0; }
  renderDetailPanel(); renderKanban();
}

  h += '</div>';

  openSlidePanel(tpl.name, h);
  document.getElementById('slide-footer').innerHTML = '<button class="btn btn-primary" style="margin-left:auto" onclick="closeSlidePanel();openCreateTask(\'' + tpl.id + '\')">使用此模板</button>';
  document.getElementById('slide-footer').style.display = 'flex';
}

// =============================================
// SETTINGS PAGE
// =============================================
function setSettingsTab(tab, el) {
  settingsTab = tab;
  document.querySelectorAll('.settings-nav-item').forEach(function(n) { n.classList.remove('active'); });
  el.classList.add('active');
  renderSettings();
}

function renderSettings() {
  var h = '';
  if (settingsTab === 'credentials') {
    h += '<div class="settings-section-title">&#128273; 凭证管理</div>';
    h += '<div class="settings-card"><div class="settings-card-header"><div class="settings-card-title">&#128274; Git Token</div><button class="btn btn-sm btn-secondary" onclick="showToast(\'请输入新的 Git Token\',\'success\')">更新</button></div>';
    h += '<div class="settings-card-desc">用于代码仓库的 Clone、Push 操作。沙箱启动时自动注入。</div>';
    h += '<div class="credential-row"><span class="credential-label">当前值</span><span class="credential-value">ghp_••••••••••••xxxx</span></div></div>';
    h += '<div class="settings-card"><div class="settings-card-header"><div class="settings-card-title">&#128274; DevOps Token</div><button class="btn btn-sm btn-secondary" onclick="showToast(\'请输入新的 DevOps Token\',\'success\')">更新</button></div>';
    h += '<div class="settings-card-desc">用于拉取需求列表、创建 MR。沙箱启动时自动注入。</div>';
    h += '<div class="credential-row"><span class="credential-label">当前值</span><span class="credential-value">dops_••••••••yyyy</span></div></div>';
  } else if (settingsTab === 'apikeys') {
    h += '<div class="settings-section-title">&#128274; API Key 管理</div>';
    h += '<div class="settings-card"><div class="settings-card-header"><div class="settings-card-title">API Key 列表</div><button class="btn btn-sm btn-primary" onclick="showToast(\'新 API Key 已创建: sk-a1b2****x8f3\',\'success\')">&#10010; 创建新 Key</button></div>';
    h += '<div class="api-key-row"><span class="api-key-name">Default Key</span><span class="api-key-masked">sk-a1b2****c4d5</span><span class="api-key-meta">创建于 2026-03-01 · 最后使用 2小时前</span><button class="btn btn-xs btn-danger" onclick="confirmAction(\'撤销 API Key\',\'撤销后使用该 Key 的请求将被拒绝\',function(){showToast(\'Key 已撤销\',\'error\')})">撤销</button></div>';
    h += '<div class="api-key-row"><span class="api-key-name">CI Key</span><span class="api-key-masked">sk-e3f4****g5h6</span><span class="api-key-meta">创建于 2026-03-15 · 最后使用 1天前</span><button class="btn btn-xs btn-danger" onclick="confirmAction(\'撤销 API Key\',\'撤销后使用该 Key 的请求将被拒绝\',function(){showToast(\'Key 已撤销\',\'error\')})">撤销</button></div>';
    h += '</div>';
  } else if (settingsTab === 'repo') {
    h += '<div class="settings-section-title">&#128193; 代码仓库配置</div>';
    h += '<div class="settings-card"><div class="form-group"><label class="form-label">默认仓库 URL</label><input class="form-input" value="https://github.com/org/agent-infra" placeholder="输入仓库 HTTPS URL"><div class="form-hint">任务创建时默认使用的代码仓库</div></div>';
    h += '<div class="form-group"><label class="form-label">默认分支</label><input class="form-input" value="main" placeholder="默认分支名称"></div>';
    h += '<div class="form-group"><label class="form-label">DevOps Endpoint</label><input class="form-input" value="https://devops.example.com/api/v1" placeholder="DevOps 平台 API 地址"></div>';
    h += '<button class="btn btn-primary" onclick="showToast(\'配置已保存\',\'success\')">保存配置</button></div>';
  } else if (settingsTab === 'provider') {
    h += '<div class="settings-section-title">&#9881; Provider 配置</div>';
    mockProviders.forEach(function(p) {
      h += '<div class="provider-setting-card"><span class="ps-icon">' + p.icon + '</span>';
      h += '<div class="ps-info"><div class="ps-name">' + p.name + (p.isDefault ? ' <span class="tag tag-green">默认</span>' : '') + (p.scope === 'system' ? ' <span class="tag tag-gray">系统预置</span>' : ' <span class="tag tag-purple">个人</span>') + '</div>';
      h += '<div class="ps-desc">' + p.desc + '</div>';
      h += '<div style="font-size:11px;color:var(--text-muted);margin-top:4px">Endpoint: ' + p.endpoint + ' · Key: ' + p.apiKeyMask + '</div></div>';
      h += '<div class="ps-actions">';
      if (!p.isDefault) h += '<button class="btn btn-xs btn-secondary" onclick="showToast(\'已设为默认 Provider\',\'success\')">设为默认</button>';

}

function testProvider(btn, pvdId) {
  btn.textContent = '测试中...'; btn.classList.add('testing');
  setTimeout(function() { btn.textContent = '✓ 连接正常'; btn.classList.remove('testing'); btn.classList.add('test-ok'); setTimeout(function() { btn.textContent = '测试连接'; btn.classList.remove('test-ok'); }, 2000); }, 1500);
}

// =============================================
// CREATE TASK MODAL (Simplified 3-Step Wizard)
// =============================================
var createStep = 1;
var selectedTplId = null;
var linkedWorkItem = null;
var linkedSubTask = null;
var allTemplatesExpanded = false;

function openCreateTask(tplId) {
  createStep = 1; selectedTplId = tplId || null; linkedWorkItem = null; linkedSubTask = null; allTemplatesExpanded = false;
  renderCreateStep();
  document.getElementById('create-task-modal').classList.add('show');
}

function openCreateTaskForSubTask(wiId, stId) {
  createStep = 1; selectedTplId = null; allTemplatesExpanded = false;
  linkedWorkItem = mockWorkItems.find(function(w) { return w.id === wiId; });
  linkedSubTask = linkedWorkItem ? linkedWorkItem.subtasks.find(function(s) { return s.id === stId; }) : null;
  renderCreateStep();
  document.getElementById('create-task-modal').classList.add('show');
}

function closeCreateTask() {
  document.getElementById('create-task-modal').classList.remove('show');
  createStep = 1; selectedTplId = null; linkedWorkItem = null; linkedSubTask = null;
}

function renderCreateStep() {
  var body = document.getElementById('create-task-body');
  var footer = document.getElementById('create-task-footer');
  var stepsHtml = '<div class="wizard-steps">';
  for (var i = 1; i <= 3; i++) {
    var cls = i < createStep ? 'done' : (i === createStep ? 'active' : '');
    stepsHtml += '<div class="wizard-step ' + cls + '"><div class="wizard-step-num">' + (i < createStep ? '&#10003;' : i) + '</div><div class="wizard-step-label">' + ['选择', '配置', '确认'][i-1] + '</div></div>';
    if (i < 3) stepsHtml += '<div class="wizard-step-line ' + (i < createStep ? 'done' : '') + '"></div>';
  }
  stepsHtml += '</div>';

  if (createStep === 1) {
    var h = stepsHtml;
    // Context card
    if (linkedWorkItem && linkedSubTask) {
      var cur = linkedWorkItem.stages.find(function(s) { return s.status === 'current'; });
      h += '<div class="req-context-card"><div class="req-ctx-header"><span class="tag tag-' + ({P1:'red',P2:'yellow',P3:'green'}[linkedWorkItem.priority]||'green') + '" style="font-size:10px">' + linkedWorkItem.priority + '</span><span class="req-ctx-title">' + escapeHtml(linkedWorkItem.title) + '</span>' + (cur ? '<span class="req-ctx-stage">' + cur.label + '</span>' : '') + '</div>';
      h += '<div style="font-size:12px;color:var(--text-secondary);margin-top:6px">子任务: ' + (stIconMap[linkedSubTask.type]||'') + ' ' + escapeHtml(linkedSubTask.title) + '</div>';
      if (linkedWorkItem.artifacts.length) { h += '<div class="req-ctx-artifacts" style="margin-top:6px">'; linkedWorkItem.artifacts.forEach(function(a) { h += '<span class="req-ctx-art">&#10003; ' + a.title + '</span>'; }); h += '</div>'; }
      h += '</div>';
      // Recommended templates
      var recs = mockStageTemplateMapping[linkedSubTask.type] || [];
      if (recs.length) {
        h += '<div class="recommend-section"><div class="recommend-title">&#11088; 推荐模板</div>';
        recs.forEach(function(r) {
          var rt = mockTemplates.find(function(t) { return t.id === r.tplId; });
          if (rt) h += '<div class="recommend-card' + (selectedTplId === rt.id ? ' selected' : '') + '" onclick="selectedTplId=\'' + rt.id + '\';renderCreateStep()" style="margin-bottom:8px"><span class="rec-icon">' + rt.icon + '</span><div class="rec-info"><div class="rec-name">' + rt.name + '</div><div class="rec-desc">' + rt.desc + '</div></div><div class="rec-check">' + (selectedTplId === rt.id ? '&#10003;' : '') + '</div></div>';
        });
        h += '</div>';
        h += '<div class="all-templates-toggle" onclick="allTemplatesExpanded=!allTemplatesExpanded;renderCreateStep()">' + (allTemplatesExpanded ? '&#9660;' : '&#9654;') + ' 全部模板</div>';
        if (allTemplatesExpanded) { h += '<div class="tpl-chip-grid">'; mockTemplates.forEach(function(t) { h += '<div class="tpl-chip' + (selectedTplId === t.id ? ' selected' : '') + '" onclick="selectedTplId=\'' + t.id + '\';renderCreateStep()"><span class="tpl-chip-icon">' + t.icon + '</span><span class="tpl-chip-name">' + t.name + '</span></div>'; }); h += '</div>'; }
      }
    } else {
      h += '<div class="form-group"><label class="form-label">选择模板</label><div class="tpl-chip-grid">';
      mockTemplates.forEach(function(t) { h += '<div class="tpl-chip' + (selectedTplId === t.id ? ' selected' : '') + '" onclick="selectedTplId=\'' + t.id + '\';renderCreateStep()"><span class="tpl-chip-icon">' + t.icon + '</span><span class="tpl-chip-name">' + t.name + '</span></div>'; });
      h += '</div></div>';
    }
    body.innerHTML = h;
    footer.innerHTML = '<button class="btn btn-secondary" onclick="closeCreateTask()">取消</button><button class="btn btn-primary" style="margin-left:auto" onclick="createStep=2;renderCreateStep()" ' + (!selectedTplId ? 'disabled' : '') + '>下一步</button>';
  } else if (createStep === 2) {
    var tpl = mockTemplates.find(function(t) { return t.id === selectedTplId; });
    var h = stepsHtml;
    h += '<div class="form-group"><label class="form-label">任务名称</label><input class="form-input" id="ct-name" value="' + (linkedSubTask ? escapeHtml(linkedSubTask.title) : (tpl ? tpl.name + ' - 新任务' : '')) + '"></div>';
    h += '<div class="form-group"><label class="form-label">自定义指令（可选）</label><textarea class="form-textarea" id="ct-instruction" placeholder="向 Agent 提供额外指令或上下文..." rows="3"></textarea></div>';
    if (tpl && tpl.params && tpl.params.length) {
      h += '<div style="font-size:12px;font-weight:600;color:var(--text-label);margin-bottom:12px;text-transform:uppercase">模板参数</div>';
      tpl.params.forEach(function(p) {
        h += '<div class="form-group"><label class="form-label">' + p.name + (p.required ? ' <span style="color:var(--danger)">*</span>' : '') + '</label>';
        if (p.type === 'select') h += '<select class="form-select"><option>' + p.default + '</option></select>';
        else if (p.type === 'boolean') h += '<label style="display:flex;align-items:center;gap:8px;font-size:13px"><input type="checkbox" ' + (p.default === 'true' ? 'checked' : '') + '> ' + p.desc + '</label>';
        else if (p.type === 'text') h += '<textarea class="form-textarea" rows="2" placeholder="' + p.desc + '">' + (linkedWorkItem ? escapeHtml(linkedWorkItem.description) : '') + '</textarea>';
        else h += '<input class="form-input" value="' + (p.default !== '-' ? p.default : '') + '" placeholder="' + p.desc + '">';
        h += '<div class="form-hint">' + p.desc + '</div></div>';
      });
    }
    body.innerHTML = h;
    footer.innerHTML = '<button class="btn btn-secondary" onclick="createStep=1;renderCreateStep()">上一步</button><button class="btn btn-primary" style="margin-left:auto" onclick="createStep=3;renderCreateStep()">下一步</button>';
  } else if (createStep === 3) {
    var tpl = mockTemplates.find(function(t) { return t.id === selectedTplId; });
    var nameEl = document.getElementById('ct-name'); var name = nameEl ? nameEl.value : (tpl ? tpl.name : '');
    var instrEl = document.getElementById('ct-instruction'); var instr = instrEl ? instrEl.value : '';
    var h = stepsHtml;
    h += '<div style="text-align:center;padding:20px 0 16px"><div style="display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;font-size:28px;margin-bottom:12px">&#9654;</div>';
    h += '<div style="font-size:16px;font-weight:600">准备创建任务</div></div>';
    h += '<div class="settings-card" style="margin-bottom:12px"><div style="font-size:12px;color:var(--text-subtle);text-transform:uppercase;margin-bottom:8px">任务信息</div>';
    h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px">';
    h += '<div><span style="color:var(--text-muted)">名称: </span>' + escapeHtml(name) + '</div>';
    h += '<div><span style="color:var(--text-muted)">模板: </span>' + (tpl ? tpl.name : '-') + '</div>';
    h += '<div><span style="color:var(--text-muted)">Provider: </span>Claude Code</div>';
    h += '<div><span style="color:var(--text-muted)">仓库: </span>github.com/org/repo</div>';
    h += '</div>';
    if (instr) h += '<div style="margin-top:10px;font-size:12px;color:var(--text-secondary);border-top:1px solid var(--border);padding-top:10px"><span style="color:var(--text-muted)">指令: </span>' + escapeHtml(instr) + '</div>';
    if (linkedWorkItem) h += '<div style="margin-top:10px;font-size:12px;color:var(--text-secondary);border-top:1px solid var(--border);padding-top:10px"><span style="color:var(--text-muted)">关联需求: </span>' + escapeHtml(linkedWorkItem.title) + '</div>';
    h += '</div>';
    h += '<div style="padding:14px 16px;background:var(--success-bg);border:1px solid rgba(0,210,160,0.2);border-radius:8px;font-size:12px;color:var(--success)">&#10003; 确认后系统将自动：创建沙箱 → 注入凭证 → Clone 代码 → 启动 Agent</div>';
    body.innerHTML = h;
    footer.innerHTML = '<button class="btn btn-secondary" onclick="createStep=2;renderCreateStep()">上一步</button><button class="btn btn-primary" style="margin-left:auto" onclick="confirmCreateTask(\'' + escapeHtml(name) + '\')">&#9654; 确认创建</button>';
  }
}

function confirmCreateTask(name) {
  var body = document.getElementById('create-task-body');
  var footer = document.getElementById('create-task-footer');
  body.innerHTML = '<div style="text-align:center;padding:40px 20px"><div style="display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:50%;background:var(--success);color:#fff;font-size:28px;margin-bottom:16px">&#10003;</div><div style="font-size:18px;font-weight:600;margin-bottom:8px">任务创建成功</div><div style="font-size:13px;color:var(--text-secondary);margin-bottom:20px">Agent 正在启动，即将开始执行</div></div>';
  footer.innerHTML = '<button class="btn btn-secondary" onclick="closeCreateTask()">关闭</button><button class="btn btn-primary" onclick="closeCreateTask();openTaskDetail(\'TASK-NEW\')">查看任务</button>';
  showToast('任务已创建: ' + (name || '新任务'), 'success');
}
</script>
